[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ckb-explorer-api-rpc-correctness"
version = "0.1.0"
description = "CKB Explorer API correctness checks against same-network CKB RPC"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
