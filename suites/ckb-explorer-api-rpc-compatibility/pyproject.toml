[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ckb-explorer-api-compat"
version = "0.1.0"
description = "Paired compatibility tests for two CKB Explorer API deployments"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ckb-api-compat = "ckb_api_compat.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
