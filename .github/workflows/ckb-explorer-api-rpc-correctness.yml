name: CKB Explorer API RPC correctness

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ckb-explorer-api-rpc-correctness.yml"
      - "reviews/**"
      - "scripts/check_test_map.py"
      - "suites/ckb-explorer-api-rpc-correctness/**"
  pull_request:
    paths:
      - ".github/workflows/ckb-explorer-api-rpc-correctness.yml"
      - "reviews/**"
      - "scripts/check_test_map.py"
      - "suites/ckb-explorer-api-rpc-correctness/**"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  correctness:
    name: Unit, mapping, and live correctness
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run deterministic unit tests
        run: python -m unittest tests.test_ckb tests.test_settings -v
        working-directory: suites/ckb-explorer-api-rpc-correctness
        env:
          PYTHONPATH: src
          RUN_LIVE_RPC_CORRECTNESS: "0"
      - name: Check TEST-MAP references
        run: python scripts/check_test_map.py --root .
      - name: Compare Explorer API with same-network CKB RPC
        run: >-
          python -m unittest
          tests.chain_data.test_v1_blocks_index
          tests.chain_data.test_v1_blocks_show
          tests.chain_data.test_v1_blocks_download_csv
          tests.chain_data.test_v1_block_transactions_show
          -v
        working-directory: suites/ckb-explorer-api-rpc-correctness
        env:
          PYTHONPATH: src
          RUN_LIVE_RPC_CORRECTNESS: "1"
