name: CKB Explorer API RPC correctness

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ckb-explorer-api-rpc-correctness.yml"
      - "reviews/**"
      - "scripts/check_test_map.py"
      - "suites/ckb-explorer-api-rpc-correctness/**"
  pull_request:
    paths:
      - ".github/workflows/ckb-explorer-api-rpc-correctness.yml"
      - "reviews/**"
      - "scripts/check_test_map.py"
      - "suites/ckb-explorer-api-rpc-correctness/**"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  unit-and-map:
    name: Unit tests and TEST-MAP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run deterministic unit tests
        run: python -m unittest tests.test_ckb tests.test_oracle tests.test_settings -v
        working-directory: suites/ckb-explorer-api-rpc-correctness
        env:
          PYTHONPATH: src
          RUN_LIVE_RPC_CORRECTNESS: "0"
      - name: Check TEST-MAP references
        run: python scripts/check_test_map.py --root .

  live:
    name: Live ${{ matrix.area }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        area:
          - chain_data
          - address_dao
          - contract_script
          - token_udt
          - nft
          - rgb_bitcoin
          - statistics_discovery
          - portfolio
          - fiber
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compare Explorer API with same-network CKB RPC
        run: python -m unittest discover -s tests/${{ matrix.area }} -t . -p 'test_*.py' -v
        working-directory: suites/ckb-explorer-api-rpc-correctness
        env:
          PYTHONPATH: src
          RUN_LIVE_RPC_CORRECTNESS: "1"
